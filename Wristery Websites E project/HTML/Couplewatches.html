<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Men's Watches | WRISTERY</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@400;500;600&display=swap"
        rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../CSS/Menwatches.css">
</head>

<body>

    <!-- HEADER START -->
    <header class="wristery-header">

        <div class="header-container">

            <!-- Hamburger Menu -->
            <div class="header-left">
                <button class="menu-button"
                    type="button"
                    data-bs-toggle="offcanvas"
                    data-bs-target="#wristeryMenu"
                    aria-controls="wristeryMenu"
                    aria-label="Open navigation menu">

                    <i class="bi bi-list"></i>
                </button>
            </div>

            <!-- Center Logo -->
            <a href="index.html" class="wristery-logo">
                <img src="../Image/Logo.png"
                    alt="WRISTERY Luxury Watches">
            </a>

            <!-- Right Header Icons -->
            <div class="header-icons">

                <!-- Search -->
                <a href="index.html#Product"
                    class="header-icon"
                    aria-label="Search watches"
                    title="Search">

                    <i class="bi bi-search"></i>
                </a>

                <!-- Sign Up -->
                <a href="signup.html"
                    class="header-icon"
                    aria-label="Sign Up"
                    title="Sign Up">

                    <i class="bi bi-person"></i>
                </a>

                <!-- Shopping Bag -->
                <a href="cart.html"
                    class="header-icon"
                    aria-label="Shopping bag"
                    title="Shopping bag">

                    <i class="bi bi-bag"></i>
                    <span class="cart-count">0</span>
                </a>

            </div>

        </div>
    </header>
    <!-- HEADER END -->


    <!-- SIDEBAR MENU START -->
    <div class="offcanvas offcanvas-start wristery-menu"
        tabindex="-1"
        id="wristeryMenu"
        aria-labelledby="wristeryMenuLabel">

        <!-- Sidebar Header -->
        <div class="offcanvas-header">

            <div>
                <h5 class="offcanvas-title"
                    id="wristeryMenuLabel">
                    WRISTERY
                </h5>

                <!-- <p class="sidebar-tagline">
                    LUXURY WATCHES
                </p> -->
            </div>

            <button type="button"
                class="btn-close"
                data-bs-dismiss="offcanvas"
                aria-label="Close menu">
            </button>

        </div>

        <!-- Sidebar Body -->
        <div class="offcanvas-body">

            <p class="menu-subtitle">
                DISCOVER OUR WORLD
            </p>

            <nav class="menu-links"
                aria-label="Main navigation">

                <a href="index.html">
                    <i class="bi bi-house"></i>
                    <span>Home</span>
                </a>

                <a href="about.html">
                    <i class="bi bi-info-circle"></i>
                    <span>About</span>
                </a>

                <!-- Categories -->
                <div class="category-menu">

                    <button class="category-toggle"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#watchCategories"
                        aria-expanded="false"
                        aria-controls="watchCategories">

                        <span class="category-label">
                            <i class="bi bi-watch"></i>
                            <span>Categories</span>
                        </span>

                        <i class="bi bi-chevron-down category-arrow"></i>

                    </button>

                    <div class="collapse" id="watchCategories">

                        <div class="subcategory-links">

                            <a href="men-watches.html">
                                <b>Men Watches</b>
                            </a>

                            <a href="women-watches.html">
                                <b>Women Watches</b>
                            </a>

                            <a href="couple-watches.html">
                                <b>Couple Watches</b>
                            </a>

                        </div>
                    </div>
                </div>

                <a href="gallery.html">
                    <i class="bi bi-images"></i>
                    <span>Gallery</span>
                </a>

                <a href="store-locator.html">
                    <i class="bi bi-geo-alt"></i>
                    <span>Store Locator</span>
                </a>

                <a href="support.html">
                    <i class="bi bi-headset"></i>
                    <span>Support</span>
                </a>

                <a href="Contact.html">
                    <i class="bi bi-envelope"></i>
                    <span>Contact Us</span>
                </a>

            </nav>

            <!-- Sidebar Footer -->
            <!-- <div class="sidebar-footer">
                <p>TIMELESS STYLE. LASTING LEGACY.</p>
            </div> -->

        </div>
    </div>
    <!-- SIDEBAR MENU END -->
  <div class="watch-video-container">
    <video class="watch-video" autoplay muted loop playsinline>
        <source src="../Video/Couple watches video.mp4" type="video/mp4">
    </video>
</div>

   

    <!-- Bootstrap JavaScript: Navbar ke liye zaroori -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
