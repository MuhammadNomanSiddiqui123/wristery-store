
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WRISTERY | Sign Up</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600&display=swap"
        rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <!-- Signup CSS -->
    <link rel="stylesheet" href="../Css/Signup.css">
</head>

<body>

    <!-- HEADER START -->
    <header class="wristery-header">

        <div class="header-container">

            <!-- LEFT: MENU BUTTON -->
            <div class="header-left">
                <button class="menu-button"
                    type="button"
                    data-bs-toggle="offcanvas"
                    data-bs-target="#wristeryMenu"
                    aria-controls="wristeryMenu"
                    aria-label="Open navigation menu">

                    <i class="bi bi-list"></i>
                </button>
            </div>

            <!-- CENTER: LOGO -->
            <a href="index.html" class="wristery-logo">
                <img src="../Image/Logo.png"
                    alt="WRISTERY Luxury Watches Logo">
            </a>

            <!-- RIGHT: ONLY ONE ACCOUNT ICON -->
           
<!-- RIGHT: HEADER ICONS -->
<div class="header-icons">

    <!-- SEARCH ICON - FIRST -->
    <button class="header-icon"
        type="button"
        id="searchButton"
        aria-label="Search"
        title="Search">

        <i class="bi bi-search"></i>
    </button>

    <!-- SIGNUP ICON - SECOND -->
    <a href="signup.html"
        class="header-icon active-account"
        aria-label="Sign Up"
        aria-current="page"
        title="Sign Up">

        <i class="bi bi-person"></i>
    </a>

    <!-- SHOPPING BAG - THIRD -->
    <a href="cart.html"
        class="header-icon"
        aria-label="Shopping bag"
        title="Shopping bag">

        <i class="bi bi-bag"></i>
        <span class="cart-count">0</span>
    </a>

</div>

        </div>

        <!-- SEARCH PANEL -->
        <div class="search-panel" id="searchPanel" hidden>

            <form class="search-form" id="searchForm">

                <i class="bi bi-search"></i>

                <input type="search"
                    id="siteSearch"
                    placeholder="Search luxury watches..."
                    aria-label="Search luxury watches">

                <button type="button"
                    id="closeSearch"
                    aria-label="Close search">

                    <i class="bi bi-x-lg"></i>
                </button>

            </form>
        </div>

    </header>
    <!-- HEADER END -->


    <!-- SIDEBAR START -->
    <div class="offcanvas offcanvas-start wristery-menu"
        tabindex="-1"
        id="wristeryMenu"
        aria-labelledby="wristeryMenuLabel">

        <div class="offcanvas-header">

            <h5 class="offcanvas-title" id="wristeryMenuLabel">
                WRISTERY
            </h5>

            <button type="button"
                class="btn-close"
                data-bs-dismiss="offcanvas"
                aria-label="Close menu">
            </button>

        </div>

        <div class="offcanvas-body">

            <p class="menu-subtitle">DISCOVER OUR WORLD</p>

            <nav class="menu-links" aria-label="Main navigation">

                <a href="index.html">
                    <i class="bi bi-house"></i>
                    <span>Home</span>
                </a>

                <a href="about.html">
                    <i class="bi bi-info-circle"></i>
                    <span>About</span>
                </a>

                <!-- CATEGORIES -->
                <div class="category-menu">

                    <button class="category-toggle"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#watchCategories"
                        aria-expanded="false"
                        aria-controls="watchCategories">

                        <span class="category-label">
                            <i class="bi bi-watch"></i>
                            <span>Categories</span>
                        </span>

                        <i class="bi bi-chevron-down category-arrow"></i>
                    </button>

                    <div class="collapse" id="watchCategories">

                        <div class="subcategory-links">

                            <a href="men-watches.html">
                                <b>Men Watches</b>
                            </a>

                            <a href="women-watches.html">
                                <b>Women Watches</b>
                            </a>

                            <a href="couple-watches.html">
                                <b>Couple Watches</b>
                            </a>

                        </div>
                    </div>
                </div>

                <a href="gallery.html">
                    <i class="bi bi-images"></i>
                    <span>Gallery</span>
                </a>

                <a href="store-locator.html">
                    <i class="bi bi-geo-alt"></i>
                    <span>Store Locator</span>
                </a>

                <a href="support.html">
                    <i class="bi bi-headset"></i>
                    <span>Support</span>
                </a>

                <a href="Contact.html">
                    <i class="bi bi-envelope"></i>
                    <span>Contact Us</span>
                </a>

            </nav>
        </div>
    </div>
    <!-- SIDEBAR END -->


    <!-- SIGNUP PAGE START -->
    <main class="signup-page">

        <div class="content">

           
<!-- LEFT: LUXURY WATCH IMAGE -->
<section class="watch-side">

    <img src="../Image/Signup picture.jpeg"
         alt="WRISTERY Luxury Watch"
         class="signup-watch-image">

</section>


            <!-- RIGHT: SIGNUP FORM -->
            <section class="form-side">

                <div class="signup-card">

                    <div class="heading">

                        <i class="bi bi-person-plus-fill"></i>

                        <h2>Create Account</h2>

                        <p>Sign up to explore luxury</p>

                    </div>

                    <form id="signupForm">

                        <!-- FULL NAME -->
                        <div class="input-group-custom">

                            <i class="bi bi-person"></i>

                            <input type="text"
                                id="name"
                                name="name"
                                placeholder="Full Name"
                                autocomplete="name"
                                required>

                        </div>

                        <!-- EMAIL -->
                        <div class="input-group-custom">

                            <i class="bi bi-envelope"></i>

                            <input type="email"
                                id="email"
                                name="email"
                                placeholder="Email Address"
                                autocomplete="email"
                                required>

                        </div>

                        <!-- PASSWORD -->
                        <div class="input-group-custom">

                            <i class="bi bi-lock"></i>

                            <input type="password"
                                id="password"
                                name="password"
                                placeholder="Password"
                                minlength="8"
                                autocomplete="new-password"
                                required>

                            <button type="button"
                                class="eye-btn"
                                data-target="password"
                                aria-label="Show password">

                                <i class="bi bi-eye"></i>
                            </button>

                        </div>

                        <!-- CONFIRM PASSWORD -->
                        <div class="input-group-custom">

                            <i class="bi bi-lock-fill"></i>

                            <input type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                placeholder="Confirm Password"
                                autocomplete="new-password"
                                required>

                            <button type="button"
                                class="eye-btn"
                                data-target="confirmPassword"
                                aria-label="Show confirm password">

                                <i class="bi bi-eye"></i>
                            </button>

                        </div>

                        <!-- TERMS AND CONDITIONS -->
                        <div class="terms">

                            <input type="checkbox"
                                id="terms"
                                name="terms"
                                required>

                            <label for="terms">

                                I agree to the

                                <a href="terms.html">
                                    Terms &amp; Conditions
                                </a>

                                and

                                <a href="privacy.html">
                                    Privacy Policy
                                </a>

                            </label>
                        </div>

                        <!-- SIGNUP BUTTON -->
                        <button type="submit" class="signup-btn">

                            <i class="bi bi-person-plus"></i>

                            Sign Up

                            <i class="bi bi-arrow-right"></i>

                        </button>

                        <p id="formStatus"
                            role="status"
                            aria-live="polite">
                        </p>

                        <!-- DIVIDER -->
                        <div class="divider">
                            <span>OR</span>
                        </div>

                        <!-- GOOGLE BUTTON -->
                        <button type="button"
                            class="social-btn"
                            id="googleSignup">

                            <i class="bi bi-google"></i>

                            Continue with Google

                        </button>

                    </form>

                </div>
            </section>

        </div>
    </main>
    <!-- SIGNUP PAGE END -->
     
    <!-- Footer -->
 <footer class="wristery-footer">

        <div class="footer-content">

            <a href="index.html" class="footer-logo">
                WRISTERY
            </a>

            <p>Timeless watches. Lasting impressions.</p>

            <p class="copyright">
                &copy; <span id="year"></span> WRISTERY.
                All Rights Reserved.
            </p>

        </div>


    </footer>


    <!-- BOOTSTRAP JAVASCRIPT -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- SIGNUP JAVASCRIPT -->
    <script src="../Js/signup.js"></script>

    <!-- SEARCH JAVASCRIPT -->
    <script>
        const searchButton = document.getElementById("searchButton");
        const searchPanel = document.getElementById("searchPanel");
        const closeSearch = document.getElementById("closeSearch");
        const siteSearch = document.getElementById("siteSearch");
        const searchForm = document.getElementById("searchForm");

        // Open and close search panel
        searchButton.addEventListener("click", function () {
            searchPanel.hidden = !searchPanel.hidden;

            if (!searchPanel.hidden) {
                siteSearch.focus();
            }
        });

        // Close search panel
        closeSearch.addEventListener("click", function () {
            searchPanel.hidden = true;
            searchButton.focus();
        });

        // Search watches
        searchForm.addEventListener("submit", function (event) {
            event.preventDefault();

            const query = siteSearch.value.trim();

            if (query) {
                window.location.href =
                    "index.html?search=" + encodeURIComponent(query);
            }
        });
    </script>

</body>
</html>
